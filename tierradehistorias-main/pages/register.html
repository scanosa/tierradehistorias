<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function registerUser(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const payload = {
                username: formData.get('username'),
                password: formData.get('password')
            };
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (response.ok) {
                alert('Registration successful');
                window.location.href = '/pages/login.html'; // Redirigir a la página de login
            } else {
                alert(data.message);
            }
        }
    </script>
</head>
<body>
    <header class="header">
        <div class="header_container">
          <nav class="header_navbar container">
            <picture class="navbar_logo">
              <a href="./index.html">
                <img src="./img/logo/logo01a.png" alt="logo Tierra de Historias" />
              </a>
            </picture>
            <ul class="navbar_links">
              <li><a href="./pages/biblioteca.html">Biblioteca</a></li>
              <li><a href="./pages/recursosdidacticos.html">Recursos Didácticos</a></li>
              <li><a href="./pages/faq.html">Preguntas Frecuentes</a></li>
              <li><a href="./pages/login.html">Acceso</a></li>
              <li><a href="./pages/register.html">Registrarse</a></li>
            </ul>
            <a href="./pages/contacto.html" class="navbar_button">
              Contactanos
            </a>
          </nav>
        </div>
      </header>
    <div class="container">
        <h1 class="mt-5">Register</h1>
        <form id="register-form" class="mt-3" onsubmit="registerUser(event)">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
    <footer class="footer">
        <div class="footer_container container">
          <picture class="footer_logo">
            <a href="./index.html">
              <img src="./img/animales/Animales_Carpincho4.png" alt="logo Tierra de Historias" />
            </a>
          </picture>
          <div class="footer_menu">
            <p>Menú</p>
            <ul class="footer_links">
              <li><a href="./pages/biblioteca.html">Biblioteca</a></li>

</body>
